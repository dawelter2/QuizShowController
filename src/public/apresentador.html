<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apresentador — Quiz Show</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; }
  input, button { font: inherit; }
  button { -webkit-tap-highlight-color: transparent; }
  .hidden { display: none !important; }

  .content { max-width: min(1400px, calc(100vw - 2rem)); margin: 0 auto; padding: 2rem 1rem; position: relative; }
  .content.layout-video { max-width: none; margin: 0; padding: .75rem 1rem; display: grid; grid-template-columns: 7fr 3fr; gap: .75rem; align-items: start; }

  h1 { font-size: 2rem; margin-bottom: .5rem; color: #fff; }
  h2 { font-size: 1.25rem; margin-bottom: 1rem; color: #a0a0b8; }
  p { color: #888; margin-bottom: 1.5rem; }

  .card { background: #1a1a2e; border-radius: 12px; padding: 2rem; margin-bottom: 1rem; border: 1px solid #2a2a3e; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; padding: .75rem 1.5rem; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 1rem; transition: all .15s; width: 100%; }
  .btn:hover { filter: brightness(1.15); transform: translateY(-1px); }
  .btn-primary { background: #6c5ce7; color: #fff; }
  .btn-success { background: #00b894; color: #fff; }
  .btn-danger { background: #d63031; color: #fff; }
  .btn-warning { background: #fdcb6e; color: #1a1a2e; }
  .btn:disabled { opacity: .5; cursor: not-allowed; filter: none; transform: none; }

  input[type="text"] { width: 100%; padding: .75rem 1rem; border-radius: 8px; border: 1px solid #2a2a3e; background: #16162a; color: #e0e0e0; font-size: 1rem; outline: none; transition: border .15s; }
  input[type="text"]:focus { border-color: #6c5ce7; }

  .flex-row { display: flex; gap: .75rem; flex-wrap: wrap; }
  .flex-row .btn { flex: 1; min-width: 80px; }
  .mt-1 { margin-top: 1rem; }
  .mb-1 { margin-bottom: 1rem; }

  .player-card { background: #1a1a2e; border: 1px solid #2a2a3e; border-radius: 8px; padding: .65rem .75rem; display: flex; align-items: center; gap: .5rem; margin-bottom: .5rem; transition: all 0.2s ease; }
  .player-card .rank-medal { width: 30px; flex-shrink: 0; text-align: center; font-size: 1.1rem; font-weight: 800; color: #a0a0b8; line-height: 1; }
  .player-card .player-identity { display: flex; align-items: center; gap: .15rem; flex: 1; min-width: 0; }
  .player-card .name { font-weight: 700; font-size: 1.15rem; color: #fff; }
  .player-card .score { font-size: 1.4rem; font-weight: 800; color: #fdcb6e; font-variant-numeric: tabular-nums; }
  .player-card .player-score-actions { display: flex; align-items: center; gap: .5rem; flex-shrink: 0; }
  .player-card.podium-1 { border-color: rgba(253,203,110,.7); background: linear-gradient(90deg, rgba(253,203,110,.14), #1a1a2e 65%); box-shadow: 0 0 16px rgba(253,203,110,.16); }
  .player-card.podium-2 { border-color: rgba(178,190,195,.55); background: linear-gradient(90deg, rgba(178,190,195,.10), #1a1a2e 65%); }
  .player-card.podium-3 { border-color: rgba(225,112,85,.55); background: linear-gradient(90deg, rgba(225,112,85,.10), #1a1a2e 65%); }
  .btn-plus { background: #00b894; color: #fff; }
  .btn-minus { background: #d63031; color: #fff; }

  /* Presença e remoção */
  .player-card.is-offline { opacity: .62; }
  .presence-dot { width: 9px; height: 9px; border-radius: 50%; background: #636e72; flex-shrink: 0; margin-right: .5rem; display: inline-block; }
  .presence-dot.online { background: #00b894; box-shadow: 0 0 6px rgba(0,184,148,.8); }
  .player-card .player-code { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: .68rem; font-weight: 700; color: #636e72; margin-left: .5rem; letter-spacing: .02em; }
  .player-card .badge-dup { margin-left: .4rem; font-size: .85rem; cursor: help; }
  .btn-kick { width: 30px; height: 30px; border-radius: 6px; border: 1px solid #3a3a52; background: #232342; color: #ff7675; font-weight: 800; cursor: pointer; flex-shrink: 0; transition: all .15s; }
  .btn-kick:hover { background: #d63031; color: #fff; border-color: #d63031; }

  /* ─── Compacto: modo vídeo ativo ─── */
  .content.layout-video .video-toggle { padding: .35rem .6rem; font-size: .8rem; }
  .content.layout-video .player-card { padding: .32rem .5rem; gap: .3rem; margin-bottom: .22rem; }
  .content.layout-video .player-card .rank-medal { width: 22px; font-size: .9rem; }
  .content.layout-video .player-card .player-identity { gap: .1rem; }
  .content.layout-video .player-card .name { font-size: .92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 1; min-width: 0; }
  .content.layout-video .player-card .score { font-size: 1rem; min-width: 30px; flex-shrink: 0; text-align: right; }
  .content.layout-video .player-card .player-score-actions { gap: .3rem; }
  .content.layout-video .player-card .player-code,
  .content.layout-video .player-card .badge-dup { display: none; }
  .content.layout-video .player-card .btn-kick { width: 23px; height: 23px; font-size: .68rem; }
  .content.layout-video .round-controls-wrap { margin-bottom: 0; }
  .content.layout-video .flex-row { gap: .35rem; }
  .content.layout-video .flex-row .btn { padding: .4rem .75rem; font-size: .85rem; min-width: 0; }
  .content.layout-video .toggle-row { float: none; display: flex; width: 100%; padding: .35rem .5rem; margin-bottom: .35rem; gap: .5rem; }
  .content.layout-video .toggle-label { font-size: .75rem; }

  /* ─── Cards isolados: ordem dos botões + placar ─── */
  .panel { background: #1a1a2e; border: 1px solid #2a2a3e; border-radius: 12px; padding: .65rem .75rem; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin-bottom: .45rem; }
  .panel-head h3 { font-size: .82rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #a0a0b8; }
  .panel-hint { font-size: .68rem; color: #636e72; white-space: nowrap; }
  .panel-body { min-height: 0; }
  .panel-order .panel-body { max-height: 26vh; overflow-y: auto; }
  .panel-answers .panel-body { max-height: 16vh; overflow-y: auto; }
  .panel-score .panel-body { max-height: 48vh; overflow-y: auto; }
  .panel-score { margin-top: auto; }
  .panel-empty { margin: 0; color: #636e72; font-size: .82rem; padding: .35rem 0; }

  .buzz-row { display: flex; align-items: center; gap: .5rem; padding: .38rem .5rem; margin-bottom: .28rem; border: 1px solid #2a2a3e; border-radius: 8px; background: #232342; animation: buzzIn .22s ease-out; }
  .buzz-row:last-child { margin-bottom: 0; }
  .buzz-row.first { border-color: #fdcb6e; background: linear-gradient(90deg, rgba(253,203,110,.16), #232342); animation: buzzIn .22s ease-out, goldPulse 1.8s ease-in-out infinite; }
  .buzz-pos { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: #6c5ce7; color: #fff; font-size: .72rem; font-weight: 900; }
  .buzz-row.first .buzz-pos { background: #fdcb6e; color: #1a1a2e; }
  .buzz-name { flex: 1; min-width: 0; font-size: .95rem; font-weight: 700; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .buzz-time { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: .68rem; font-weight: 700; color: #a29bfe; white-space: nowrap; }
  .buzz-actions { display: flex; gap: .22rem; flex-shrink: 0; }
  .buzz-actions button { min-width: 30px; height: 28px; border-radius: 5px; border: none; cursor: pointer; font-weight: 800; font-size: .68rem; padding: 0 .3rem; }
  .content.layout-video .buzz-row { padding: .3rem .45rem; margin-bottom: .22rem; gap: .4rem; }
  .content.layout-video .buzz-pos { width: 24px; height: 24px; font-size: .66rem; }
  .content.layout-video .buzz-name { font-size: .9rem; }
  .content.layout-video .buzz-actions { gap: .12rem; }
  .content.layout-video .buzz-actions button { min-width: 24px; height: 23px; font-size: .58rem; padding: 0 .2rem; }
  @keyframes buzzIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes goldPulse { 0%,100% { box-shadow: 0 0 8px rgba(253,203,110,.4); } 50% { box-shadow: 0 0 22px rgba(253,203,110,.95); } }

  .answer-row { display: flex; align-items: baseline; gap: .4rem; padding: .32rem .1rem; border-bottom: 1px solid rgba(42,42,62,.7); font-size: .84rem; }
  .answer-row:last-child { border-bottom: none; }
  .answer-pos { min-width: 24px; color: #6c5ce7; font-size: .72rem; font-weight: 800; }
  .answer-name { color: #e0e0e0; font-weight: 700; white-space: nowrap; }
  .answer-text { color: #fdcb6e; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .round-go { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 1000; opacity: 0; }
  .round-go .go-text { font-size: clamp(6rem, 22vw, 14rem); font-weight: 900; color: #fdcb6e; text-shadow: 0 0 40px rgba(253,203,110,.9), 0 0 80px rgba(253,203,110,.4); transform: scale(.3); letter-spacing: .05em; }
  .round-go.show { animation: goPop .6s ease-out forwards; }
  .round-go.show .go-text { animation: goText .6s ease-out forwards; }
  @keyframes goPop { 0% { opacity: 0; } 25% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes goText { 0% { transform: scale(.3); } 40% { transform: scale(1.18); } 70% { transform: scale(1); } 100% { transform: scale(1.05); } }

  .nav-bar { display: flex; justify-content: space-between; align-items: center; padding: .75rem 1rem; background: #1a1a2e; border-bottom: 1px solid #2a2a3e; }
  .nav-bar .room-code { font-size: .85rem; color: #6c5ce7; font-weight: 600; }

  .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); background: #1a1a2e; border: 1px solid #2a2a3e; padding: .75rem 1.5rem; border-radius: 8px; font-size: .9rem; z-index: 100; }

  .dropdown { position: relative; display: inline-block; }
  .dropdown-btn { background: none; border: 1px solid #2a2a3e; color: #a0a0b8; padding: .4rem .75rem; border-radius: 6px; cursor: pointer; font-size: .85rem; }
  .dropdown-btn:hover { background: #2a2a3e; }
  .dropdown-menu { position: absolute; top: 100%; right: 0; background: #1a1a2e; border: 1px solid #2a2a3e; border-radius: 8px; min-width: 170px; z-index: 50; display: none; overflow: hidden; margin-top: 4px; }
  .dropdown-menu.show { display: block; }
  .dropdown-menu button { display: block; width: 100%; padding: .6rem 1rem; text-align: left; border: none; background: none; color: #e0e0e0; font-size: .85rem; cursor: pointer; }
  .dropdown-menu button:hover { background: #2a2a3e; }
  .dropdown-menu .divider { height: 1px; background: #2a2a3e; margin: .25rem 0; }

  /* Novos estilos de status */
  .status-bar { display: flex; gap: .5rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
  .badge { display: inline-flex; align-items: center; padding: .4rem .75rem; border-radius: 6px; font-size: .85rem; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; }

  /* Toggle Switch */
  .toggle-row { display: inline-flex; float: right; align-items: center; gap: .75rem; margin-bottom: .75rem; padding: .5rem .75rem; background: #1a1a2e; border: 1px solid #2a2a3e; border-radius: 8px; }
  .toggle-switch { position: relative; display: inline-block; width: 44px; height: 24px; flex-shrink: 0; }
  .toggle-switch input { opacity: 0; width: 0; height: 0; }
  .toggle-slider { position: absolute; cursor: pointer; inset: 0; background: #2a2a3e; border-radius: 24px; transition: background .2s; }
  .toggle-slider::before { content: ''; position: absolute; left: 3px; bottom: 3px; width: 18px; height: 18px; background: #636e72; border-radius: 50%; transition: all .2s; }
  .toggle-switch input:checked + .toggle-slider { background: #6c5ce7; }
  .toggle-switch input:checked + .toggle-slider::before { background: #fff; transform: translateX(20px); }
  .toggle-label { font-size: .85rem; color: #a0a0b8; font-weight: 600; cursor: pointer; user-select: none; }
  .badge-outline { background: #16162a; border: 1px solid #2a2a3e; color: #a0a0b8; }
  .badge-primary { background: #6c5ce7; color: #fff; box-shadow: 0 2px 8px rgba(108,92,231,.3); }

  .round-controls-wrap { margin-bottom: 1rem; }

  /* ─── Painel de Vídeo YouTube ─── */
  .content-left { display: flex; flex-direction: column; min-width: 0; }
  .content-left .video-toggle { margin-bottom: .5rem; }
  .video-section { display: flex; flex-direction: column; flex: 1; }
  .video-toggle {
    display: flex; align-items: center; justify-content: center; gap: .5rem;
    width: 100%; padding: .5rem .75rem;
    background: #1a1a2e; border: 1px solid #2a2a3e; border-radius: 8px;
    color: #a0a0b8; font-size: .85rem; font-weight: 600; cursor: pointer;
    transition: all .15s;
  }
  .video-toggle:hover { background: #2a2a3e; color: #e0e0e0; }
  .video-toggle.active { background: #6c5ce7; color: #fff; border-color: #6c5ce7; }
  .video-panel {
    background: #1a1a2e; border: 1px solid #2a2a3e; border-radius: 8px;
    resize: both; overflow: auto; position: relative;
    flex-shrink: 0; width: 100%; min-height: 400px; min-width: 280px;
    height: calc(100vh - 200px);
    display: flex; flex-direction: column;
  }
  .content.layout-video .video-panel { height: calc(100vh - 90px); }
  .video-input-row { display: flex; gap: .5rem; padding: .75rem .75rem 0 .75rem; flex-shrink: 0; }
  .video-input-row input { flex: 1; }
  .video-input-row .btn { width: auto; white-space: nowrap; }
  #video-container { flex: 1; min-height: 120px; display: flex; align-items: center; justify-content: center; background: #000; border-radius: 4px; overflow: hidden; position: relative; }
  #video-container iframe { width: 100%; height: 100%; border: none; }
  .video-empty {
    display: flex; align-items: center; justify-content: center;
    flex: 1; min-height: 120px;
    color: #636e72; font-size: .85rem;
  }
  .video-demo-placeholder {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .6rem;
    width: 100%; height: 100%; min-height: 180px; text-align: center;
    background: radial-gradient(circle at 50% 42%, rgba(108,92,231,.35), rgba(8,8,12,.98) 68%);
    color: #fdcb6e; font-size: 1.35rem; font-weight: 800; letter-spacing: .06em;
  }
  .video-demo-placeholder span { color: #a0a0b8; font-size: .72rem; font-weight: 700; letter-spacing: .25em; text-transform: uppercase; }
  .preview-badge {
    background: rgba(253,203,110,.12); border: 1px solid rgba(253,203,110,.45);
    color: #fdcb6e; border-radius: 999px; padding: .3rem .7rem;
    font-size: .68rem; font-weight: 800; letter-spacing: .06em; white-space: nowrap;
  }
  .content-right { min-width: 0; overflow-y: auto; max-height: calc(100vh - 120px); padding-right: .25rem; display: flex; flex-direction: column; gap: .65rem; }
  .content-right .round-controls-wrap { margin-bottom: 0; }
  .content.layout-video .content-right .round-controls-wrap { flex: 0 0 auto; }
  .content.layout-video .content-right { height: calc(100vh - 90px); max-height: calc(100vh - 90px); overflow: hidden; }
  .content.layout-video .content-right > * { max-width: 100%; }
  .content.layout-video .panel { display: flex; flex-direction: column; min-height: 0; padding: .55rem .65rem; }
  .content.layout-video .panel-order { flex: 0 1 27%; min-height: 100px; }
  .content.layout-video .panel-answers { flex: 0 1 10%; min-height: 64px; }
  .content.layout-video .panel-score { flex: 1 1 auto; min-height: 150px; margin-top: 0; }
  .content.layout-video .panel-order .panel-body,
  .content.layout-video .panel-answers .panel-body,
  .content.layout-video .panel-score .panel-body { flex: 1 1 auto; max-height: none; overflow-y: auto; }

  .video-panel .video-close-btn {
    position: absolute; top: .75rem; right: .75rem; z-index: 10;
    width: 28px; height: 28px; border-radius: 50%; border: none;
    background: rgba(0,0,0,.6); color: #fff;
    font-size: .9rem; cursor: pointer; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
  }
  .video-panel .video-close-btn:hover { background: rgba(0,0,0,.8); }
</style>
</head>
<body>

<div class="round-go" id="round-go"><div class="go-text">GO!</div></div>

<div class="nav-bar">
  <span><strong>🎬 <span id="pres-title"></span></strong></span>
  <span class="room-code" style="cursor:pointer;" onclick="copyRoomCode()" title="Copiar código">📋 <span id="pres-code"></span></span>
  <div class="dropdown">
    <button class="dropdown-btn" onclick="toggleMenu('pres-menu')">☰ Menu</button>
    <div class="dropdown-menu" id="pres-menu">
      <button onclick="openScore()">📺 Abrir Transmissão</button>
      <div class="divider"></div>
      <button onclick="handleResetGame()" style="color:#ff7675;">🔄 Reiniciar Partida</button>
      <div class="divider"></div>
      <button onclick="handleCloseRoom()">🚪 Encerrar Sala</button>
      <button onclick="handleLeaveRoom()">🔙 Sair da Sala</button>
      <div class="divider"></div>
      <button onclick="handleRename()">✏️ Mudar Nome</button>
    </div>
  </div>
</div>

<div class="content">
  <div class="content-left">
    <button class="video-toggle" id="btn-video-toggle" onclick="toggleVideoPanel()">📺 Vídeo</button>
    <div class="video-section">
      <div class="video-panel hidden" id="video-panel">
        <button class="video-close-btn" onclick="closeVideo()" id="video-close-btn">✕</button>
        <div class="video-input-row" id="video-input-row">
          <input type="text" id="video-url" placeholder="https://youtube.com/watch?v=..." onkeydown="if(event.key==='Enter') loadVideo()" />
          <button class="btn btn-primary" onclick="loadVideo()">Carregar</button>
          <button class="btn btn-danger" onclick="toggleVideoPanel()">✕</button>
        </div>
        <div id="video-container" class="hidden">
          <div class="video-empty" id="video-empty">Cole a URL do YouTube e clique em Carregar</div>
        </div>
      </div>
    </div>
  </div>
  <div class="content-right">
    <div class="round-controls-wrap">
      <div class="flex-row mb-1">
        <button class="btn btn-success" id="btn-round-control" onclick="handleRoundControl()">▶ Começar Rodada</button>
      </div>
      <div class="toggle-row">
        <label class="toggle-switch">
          <input type="checkbox" id="toggle-auto-next" onchange="toggleAutoNextRound(this.checked)">
          <span class="toggle-slider"></span>
        </label>
        <label class="toggle-label" for="toggle-auto-next">Auto-próxima rodada</label>
      </div>
      <div class="status-bar" id="pres-round-info">
        <span class="badge badge-outline" id="pres-round-room-title"></span>
        <span class="badge badge-primary">Rodada <span id="pres-round-num">1</span></span>
      </div>
    </div>
    <section class="panel panel-order" aria-labelledby="pres-order-title">
      <div class="panel-head">
        <h3 id="pres-order-title">⚡ Ordem dos botões</h3>
        <span class="panel-hint">cliques da rodada</span>
      </div>
      <div class="panel-body" id="pres-buzzer-order"></div>
    </section>

    <section class="panel panel-answers" aria-labelledby="pres-answers-title">
      <div class="panel-head">
        <h3 id="pres-answers-title">✍️ Respostas</h3>
      </div>
      <div class="panel-body" id="pres-answers"></div>
    </section>

    <section class="panel panel-score" aria-labelledby="pres-score-title">
      <div class="panel-head">
        <h3 id="pres-score-title">🏆 Placar</h3>
        <span class="panel-hint">ordem dos pontos</span>
      </div>
      <div class="panel-body" id="pres-players"></div>
    </section>
  </div>
</div>

<script>window.__PRESENTER_DEMO__ = new URLSearchParams(location.search).get('demo') === '1';</script>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/common.js"></script>
<script src="/js/apresentador.js"></script>
<script src="/js/apresentador-demo.js"></script>
</body>
</html>
